# NOTE: For PyPI Trusted Publishing (OIDC), use composite action python-tag-and-publish/action.yml instead so OIDC claims match the caller repository (warehouse#11096).
name: Publish

on: [workflow_call]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Download built package
        uses: actions/download-artifact@v4
        with:
          name: dist

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true

      - name: Publish package
        run: uv publish

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --generate-notes dist/* || :
