# Composite action used instead of reusable workflow so GitHub Actions OIDC claims match the caller repository for PyPI Trusted Publishing (warehouse#11096)
name: "Python Publish"
description: "Publishes package to PyPI via Trusted Publishing (uv publish) and creates a GitHub release"

inputs:
  python-version-file:
    description: "Path to Python version file"
    required: false
    default: ".python-version"

runs:
  using: "composite"
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install UV
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Download built package
      uses: actions/download-artifact@v4
      with:
        name: dist

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        use_oidc: true

    # Uses PyPI Trusted Publishing exclusively via OIDC minting - no API tokens
    - name: Publish package to PyPI
      shell: bash
      run: uv publish

    - name: Create GitHub Release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "${{ github.ref_name }}" --generate-notes dist/* || :
